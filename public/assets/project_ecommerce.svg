<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ecomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18040d" />
      <stop offset="50%" stop-color="#280918" />
      <stop offset="100%" stop-color="#110309" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#351020" />
      <stop offset="100%" stop-color="#1e0712" />
    </linearGradient>
    <linearGradient id="primaryBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e62857" />
      <stop offset="100%" stop-color="#991236" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#ecomBg)" />

  <!-- Header & Cart Navigation -->
  <rect x="25" y="20" width="750" height="52" rx="14" fill="url(#cardGrad)" filter="url(#shadow)" stroke="rgba(255,100,140,0.18)" stroke-width="1.2" />
  <circle cx="52" cy="46" r="8" fill="#e62857" />
  <text x="75" y="52" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#ffffff">E-COMMERCE STOREFRONT &amp; INVENTORY</text>
  
  <!-- Cart badge -->
  <rect x="620" y="32" width="140" height="28" rx="8" fill="url(#primaryBtn)" />
  <text x="645" y="50" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#ffffff">🛒 CART (3 ITEMS)</text>

  <!-- 3 Product Cards -->
  <!-- Product 1 -->
  <g filter="url(#shadow)">
    <rect x="25" y="90" width="230" height="330" rx="18" fill="url(#cardGrad)" stroke="rgba(255,100,140,0.16)" stroke-width="1.2" />
    <!-- Product Thumbnail -->
    <rect x="42" y="108" width="196" height="135" rx="12" fill="#17050e" stroke="rgba(255,100,140,0.1)" />
    <circle cx="140" cy="175" r="34" fill="linear-gradient(135deg, #e62857, #6e0921)" opacity="0.8" />
    <text x="140" y="180" font-family="'Outfit', sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">ESP32</text>
    
    <text x="45" y="270" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#fff">ESP32 IoT Controller</text>
    <text x="45" y="290" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9a7b0">WiFi + Bluetooth Dev Board</text>
    
    <text x="45" y="330" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#ffd166">₱320.00</text>
    <!-- Add to cart button -->
    <rect x="45" y="355" width="190" height="42" rx="12" fill="url(#primaryBtn)" stroke="rgba(255,180,210,0.3)" />
    <text x="140" y="381" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">+ Add To Cart</text>
  </g>

  <!-- Product 2 -->
  <g filter="url(#shadow)">
    <rect x="285" y="90" width="230" height="330" rx="18" fill="url(#cardGrad)" stroke="rgba(255,100,140,0.16)" stroke-width="1.2" />
    <rect x="302" y="108" width="196" height="135" rx="12" fill="#17050e" stroke="rgba(255,100,140,0.1)" />
    <rect x="370" y="145" width="60" height="60" rx="10" fill="linear-gradient(135deg, #06d6a0, #035a43)" opacity="0.8" />
    <text x="400" y="180" font-family="'Outfit', sans-serif" font-size="15" font-weight="900" fill="#fff" text-anchor="middle">RELAY</text>
    
    <text x="305" y="270" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#fff">4-Channel Relay Mod</text>
    <text x="305" y="290" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9a7b0">Optocoupler Isolation</text>
    
    <text x="305" y="330" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#ffd166">₱185.00</text>
    <rect x="305" y="355" width="190" height="42" rx="12" fill="url(#primaryBtn)" stroke="rgba(255,180,210,0.3)" />
    <text x="400" y="381" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">+ Add To Cart</text>
  </g>

  <!-- Product 3 -->
  <g filter="url(#shadow)">
    <rect x="545" y="90" width="230" height="330" rx="18" fill="url(#cardGrad)" stroke="rgba(255,100,140,0.16)" stroke-width="1.2" />
    <rect x="562" y="108" width="196" height="135" rx="12" fill="#17050e" stroke="rgba(255,100,140,0.1)" />
    <polygon points="660,140 625,200 695,200" fill="linear-gradient(135deg, #ff477e, #a8173c)" opacity="0.85" />
    <text x="660" y="185" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" fill="#fff" text-anchor="middle">DHT22</text>
    
    <text x="565" y="270" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#fff">Digital Temp &amp; RH</text>
    <text x="565" y="290" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9a7b0">High Accuracy Sensor</text>
    
    <text x="565" y="330" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#ffd166">₱140.00</text>
    <rect x="565" y="355" width="190" height="42" rx="12" fill="url(#primaryBtn)" stroke="rgba(255,180,210,0.3)" />
    <text x="660" y="381" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">+ Add To Cart</text>
  </g>
</svg>
