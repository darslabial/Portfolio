<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="awasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19050d" />
      <stop offset="50%" stop-color="#240815" />
      <stop offset="100%" stop-color="#110309" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#330f1e" />
      <stop offset="100%" stop-color="#1d0711" />
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e62857" />
      <stop offset="100%" stop-color="#ff6b8b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#awasBg)" />

  <!-- Top App Header -->
  <rect x="25" y="20" width="750" height="52" rx="14" fill="url(#cardGrad)" filter="url(#shadow)" stroke="rgba(255,100,140,0.18)" stroke-width="1.2" />
  <circle cx="52" cy="46" r="10" fill="#e62857" />
  <circle cx="52" cy="46" r="5" fill="#fff" />
  <text x="75" y="52" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="0.5">AWAS // EARLY WARNING TELEMETRY SYSTEM</text>
  
  <rect x="580" y="32" width="180" height="28" rx="8" fill="#14050b" stroke="rgba(230,40,87,0.3)" />
  <circle cx="596" cy="46" r="4" fill="#06d6a0" />
  <text x="608" y="50" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#06d6a0">STATUS: SENSORS ACTIVE</text>

  <!-- Main Telemetry Wave Graph Card -->
  <g filter="url(#shadow)">
    <rect x="25" y="88" width="480" height="230" rx="18" fill="url(#cardGrad)" stroke="rgba(255,100,140,0.16)" stroke-width="1.2" />
    <text x="50" y="122" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#fff">REAL-TIME HAZARD THRESHOLD MONITOR</text>
    <text x="50" y="142" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9a7b0">Water Level &amp; Environmental Sensor Telemetry</text>

    <!-- Graph Grid Lines -->
    <line x1="50" y1="170" x2="475" y2="170" stroke="rgba(255,100,140,0.08)" stroke-dasharray="4" />
    <line x1="50" y1="210" x2="475" y2="210" stroke="rgba(255,100,140,0.08)" stroke-dasharray="4" />
    <line x1="50" y1="250" x2="475" y2="250" stroke="rgba(255,100,140,0.08)" stroke-dasharray="4" />
    <line x1="50" y1="285" x2="475" y2="285" stroke="rgba(255,100,140,0.15)" />

    <!-- Danger Threshold Line -->
    <line x1="50" y1="185" x2="475" y2="185" stroke="#f8961e" stroke-width="1.5" stroke-dasharray="6,4" />
    <text x="360" y="180" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f8961e">ALERT THRESHOLD: 3.5m</text>

    <!-- Wave Area -->
    <path d="M 50 270 Q 110 230 160 255 T 270 205 T 380 235 T 475 195 L 475 285 L 50 285 Z" fill="rgba(230,40,87,0.12)" />
    <!-- Wave Line -->
    <path d="M 50 270 Q 110 230 160 255 T 270 205 T 380 235 T 475 195" fill="none" stroke="url(#alertGrad)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="475" cy="195" r="5" fill="#ff6b8b" />
    <circle cx="475" cy="195" r="10" fill="none" stroke="#ff6b8b" stroke-opacity="0.5" stroke-width="1.5" />
  </g>

  <!-- Side Gauge & Protocol Card -->
  <g filter="url(#shadow)">
    <rect x="525" y="88" width="250" height="230" rx="18" fill="url(#cardGrad)" stroke="rgba(255,100,140,0.16)" stroke-width="1.2" />
    <text x="545" y="122" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#fff">SYSTEM READINESS</text>
    
    <!-- Circular Gauge -->
    <circle cx="650" cy="195" r="52" fill="none" stroke="#16050c" stroke-width="10" />
    <circle cx="650" cy="195" r="52" fill="none" stroke="#e62857" stroke-width="10" stroke-dasharray="240 330" stroke-linecap="round" transform="rotate(-90 650 195)" />
    <text x="650" y="193" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">98.4%</text>
    <text x="650" y="210" font-family="'JetBrains Mono', monospace" font-size="9" fill="#c9a7b0" text-anchor="middle">UPTIME</text>

    <!-- Siren status -->
    <rect x="545" y="270" width="210" height="32" rx="8" fill="#14050b" stroke="rgba(255,100,140,0.12)" />
    <text x="560" y="291" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fff">SIREN RELAY: <tspan fill="#06d6a0">ARMED</tspan></text>
  </g>

  <!-- Bottom Metric Cards -->
  <g filter="url(#shadow)">
    <rect x="25" y="335" width="235" height="92" rx="14" fill="url(#cardGrad)" stroke="rgba(255,100,140,0.14)" />
    <text x="45" y="365" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9a7b0">WATER LEVEL</text>
    <text x="45" y="398" font-family="'Outfit', sans-serif" font-size="24" font-weight="800" fill="#fff">2.42 m</text>
    <text x="145" y="398" font-family="'JetBrains Mono', monospace" font-size="11" fill="#06d6a0">NORMAL</text>

    <rect x="282" y="335" width="235" height="92" rx="14" fill="url(#cardGrad)" stroke="rgba(255,100,140,0.14)" />
    <text x="302" y="365" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9a7b0">RAINFALL SENSOR</text>
    <text x="302" y="398" font-family="'Outfit', sans-serif" font-size="24" font-weight="800" fill="#fff">14.8 mm</text>
    <text x="415" y="398" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f8961e">MODERATE</text>

    <rect x="540" y="335" width="235" height="92" rx="14" fill="url(#cardGrad)" stroke="rgba(255,100,140,0.14)" />
    <text x="560" y="365" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9a7b0">DISPATCH SMS / IP</text>
    <text x="560" y="398" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#fff">AUTO-READY</text>
  </g>
</svg>
