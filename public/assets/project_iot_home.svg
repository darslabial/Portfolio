<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="iotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18040d" />
      <stop offset="50%" stop-color="#260917" />
      <stop offset="100%" stop-color="#12030a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#351020" />
      <stop offset="100%" stop-color="#1e0813" />
    </linearGradient>
    <linearGradient id="relayActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e62857" />
      <stop offset="100%" stop-color="#991236" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#iotBg)" />

  <!-- App Header -->
  <rect x="25" y="20" width="750" height="52" rx="14" fill="url(#cardGrad)" filter="url(#shadow)" stroke="rgba(255,100,140,0.18)" stroke-width="1.2" />
  <circle cx="52" cy="46" r="8" fill="#e62857" />
  <text x="75" y="52" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#ffffff">SMART IOT HOME AUTOMATION HUB</text>
  <rect x="575" y="32" width="185" height="28" rx="8" fill="#15050c" stroke="rgba(255,100,140,0.2)" />
  <text x="590" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#06d6a0">● 4 NODES ONLINE (ESP32)</text>

  <!-- 4 Tactile Relay Cards -->
  <!-- Node 1: Living Room Lights -->
  <g filter="url(#shadow)">
    <rect x="25" y="90" width="230" height="155" rx="18" fill="url(#cardGrad)" stroke="rgba(255,100,140,0.16)" stroke-width="1.2" />
    <text x="45" y="125" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#fff">Living Room Light</text>
    <text x="45" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9a7b0">Relay #1 · 220V</text>
    
    <!-- Physical Clay Switch Button (ON) -->
    <rect x="45" y="170" width="190" height="48" rx="24" fill="url(#relayActive)" stroke="rgba(255,180,210,0.4)" stroke-width="1.5" />
    <circle cx="205" cy="194" r="18" fill="#ffffff" filter="url(#shadow)" />
    <text x="65" y="200" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#ffffff">STATE: ON</text>
  </g>

  <!-- Node 2: Climate / AC -->
  <g filter="url(#shadow)">
    <rect x="285" y="90" width="230" height="155" rx="18" fill="url(#cardGrad)" stroke="rgba(255,100,140,0.16)" stroke-width="1.2" />
    <text x="305" y="125" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#fff">Air Conditioning</text>
    <text x="305" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9a7b0">Thermostat · 24°C</text>
    
    <!-- Physical Clay Switch Button (ON) -->
    <rect x="305" y="170" width="190" height="48" rx="24" fill="url(#relayActive)" stroke="rgba(255,180,210,0.4)" stroke-width="1.5" />
    <circle cx="465" cy="194" r="18" fill="#ffffff" filter="url(#shadow)" />
    <text x="325" y="200" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#ffffff">STATE: ON</text>
  </g>

  <!-- Node 3: Water Heater -->
  <g filter="url(#shadow)">
    <rect x="545" y="90" width="230" height="155" rx="18" fill="url(#cardGrad)" stroke="rgba(255,100,140,0.16)" stroke-width="1.2" />
    <text x="565" y="125" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#fff">Water Heater</text>
    <text x="565" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9a7b0">Relay #3 · Standby</text>
    
    <!-- Physical Clay Switch Button (OFF) -->
    <rect x="565" y="170" width="190" height="48" rx="24" fill="#15050c" stroke="rgba(255,100,140,0.15)" stroke-width="1.2" />
    <circle cx="595" cy="194" r="18" fill="#3a1122" filter="url(#shadow)" stroke="rgba(255,120,160,0.2)" />
    <text x="635" y="200" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#8e6270">STATE: OFF</text>
  </g>

  <!-- Environment Telemetry Bar -->
  <g filter="url(#shadow)">
    <rect x="25" y="270" width="750" height="155" rx="18" fill="url(#cardGrad)" stroke="rgba(255,100,140,0.16)" stroke-width="1.2" />
    <text x="50" y="305" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#fff">ENVIRONMENTAL TELEMETRY GAUGES (DHT22 SENSORS)</text>

    <!-- Temp Gauge -->
    <rect x="50" y="325" width="210" height="75" rx="12" fill="#16050e" stroke="rgba(255,100,140,0.1)" />
    <text x="70" y="352" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9a7b0">AMBIENT TEMP</text>
    <text x="70" y="385" font-family="'Outfit', sans-serif" font-size="26" font-weight="900" fill="#ff4d7a">26.5 °C</text>

    <!-- Humidity Gauge -->
    <rect x="285" y="325" width="210" height="75" rx="12" fill="#16050e" stroke="rgba(255,100,140,0.1)" />
    <text x="305" y="352" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9a7b0">HUMIDITY</text>
    <text x="305" y="385" font-family="'Outfit', sans-serif" font-size="26" font-weight="900" fill="#00d8ff">58.2 %</text>

    <!-- Power Consumption -->
    <rect x="520" y="325" width="230" height="75" rx="12" fill="#16050e" stroke="rgba(255,100,140,0.1)" />
    <text x="540" y="352" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9a7b0">ACTIVE LOAD</text>
    <text x="540" y="385" font-family="'Outfit', sans-serif" font-size="26" font-weight="900" fill="#06d6a0">385 Watts</text>
  </g>
</svg>
