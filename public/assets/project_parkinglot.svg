<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="parkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18040d" />
      <stop offset="50%" stop-color="#280918" />
      <stop offset="100%" stop-color="#110309" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#351020" />
      <stop offset="100%" stop-color="#1e0712" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#parkBg)" />

  <!-- Header -->
  <rect x="25" y="20" width="750" height="52" rx="14" fill="url(#cardGrad)" filter="url(#shadow)" stroke="rgba(255,100,140,0.18)" stroke-width="1.2" />
  <circle cx="52" cy="46" r="8" fill="#e62857" />
  <text x="75" y="52" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#ffffff">SMART PARKING LOT MANAGEMENT SYSTEM</text>
  <rect x="580" y="32" width="180" height="28" rx="8" fill="#15050c" stroke="rgba(255,100,140,0.2)" />
  <text x="595" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#06d6a0">AVAILABLE: 14 / 32 SLOTS</text>

  <!-- Visual Parking Grid -->
  <g filter="url(#shadow)">
    <rect x="25" y="90" width="510" height="335" rx="18" fill="url(#cardGrad)" stroke="rgba(255,100,140,0.16)" stroke-width="1.2" />
    <text x="50" y="125" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#fff">LIVE SLOT SENSOR MATRIX</text>

    <!-- Parking Row A -->
    <!-- Slot A1 Occupied -->
    <rect x="50" y="150" width="95" height="120" rx="10" fill="#1f0712" stroke="#e62857" stroke-width="2" />
    <text x="65" y="180" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#e62857">A-01</text>
    <rect x="62" y="200" width="70" height="40" rx="6" fill="#7a1027" />
    <text x="70" y="225" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fff">OCCUPIED</text>

    <!-- Slot A2 Available -->
    <rect x="165" y="150" width="95" height="120" rx="10" fill="#160810" stroke="#06d6a0" stroke-width="2" stroke-dasharray="4" />
    <text x="180" y="180" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#06d6a0">A-02</text>
    <text x="175" y="225" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#06d6a0">VACANT</text>

    <!-- Slot A3 Occupied -->
    <rect x="280" y="150" width="95" height="120" rx="10" fill="#1f0712" stroke="#e62857" stroke-width="2" />
    <text x="295" y="180" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#e62857">A-03</text>
    <rect x="292" y="200" width="70" height="40" rx="6" fill="#7a1027" />
    <text x="300" y="225" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fff">OCCUPIED</text>

    <!-- Slot A4 Reserved -->
    <rect x="395" y="150" width="95" height="120" rx="10" fill="#1c0a10" stroke="#f8961e" stroke-width="2" />
    <text x="410" y="180" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#f8961e">A-04</text>
    <text x="405" y="225" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f8961e">RESERVED</text>

    <!-- Road / Driveway Markings -->
    <line x1="50" y1="295" x2="490" y2="295" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="12,12" />
    <text x="220" y="325" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8e6270">ONE-WAY LANE ››</text>

    <!-- Entry Gate Barrier -->
    <rect x="50" y="350" width="440" height="52" rx="10" fill="#16050e" stroke="rgba(255,100,140,0.15)" />
    <text x="70" y="382" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#fff">BARRIER GATE STATUS: <tspan fill="#06d6a0">LOWERED (AUTO-SCAN)</tspan></text>
  </g>

  <!-- Side Telemetry & Billing Card -->
  <g filter="url(#shadow)">
    <rect x="555" y="90" width="220" height="335" rx="18" fill="url(#cardGrad)" stroke="rgba(255,100,140,0.16)" stroke-width="1.2" />
    <text x="575" y="125" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#fff">TELEMETRY &amp; RATE</text>

    <!-- Current Rate -->
    <rect x="575" y="150" width="180" height="75" rx="12" fill="#16050e" stroke="rgba(255,100,140,0.12)" />
    <text x="590" y="178" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c9a7b0">PARKING FEE</text>
    <text x="590" y="208" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" fill="#ffd166">₱40.00 <tspan font-size="13" font-weight="600" fill="#c9a7b0">/ hr</tspan></text>

    <!-- Vehicles Logged -->
    <rect x="575" y="240" width="180" height="75" rx="12" fill="#16050e" stroke="rgba(255,100,140,0.12)" />
    <text x="590" y="268" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c9a7b0">TODAY'S LOG</text>
    <text x="590" y="298" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" fill="#06d6a0">142 VEHICLES</text>

    <!-- RFID Ready -->
    <rect x="575" y="335" width="180" height="65" rx="12" fill="#16050e" stroke="rgba(255,100,140,0.12)" />
    <text x="590" y="362" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c9a7b0">READER PROTOCOL</text>
    <text x="590" y="385" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#ff4d7a">RFID / BARCODE</text>
  </g>
</svg>
