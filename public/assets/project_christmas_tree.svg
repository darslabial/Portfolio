<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="treeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18040d" />
      <stop offset="50%" stop-color="#280918" />
      <stop offset="100%" stop-color="#110309" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#351020" />
      <stop offset="100%" stop-color="#1e0712" />
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#e62857" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#treeBg)" />

  <!-- Header -->
  <rect x="25" y="20" width="750" height="52" rx="14" fill="url(#cardGrad)" filter="url(#shadow)" stroke="rgba(255,100,140,0.18)" stroke-width="1.2" />
  <circle cx="52" cy="46" r="8" fill="#06d6a0" />
  <text x="75" y="52" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#ffffff">INTERACTIVE CANVAS SPATIAL TREE // TYPESCRIPT</text>
  <rect x="580" y="32" width="180" height="28" rx="8" fill="#15050c" stroke="rgba(255,100,140,0.2)" />
  <text x="595" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#06d6a0">60 FPS · 1,400 PARTICLES</text>

  <!-- Main Canvas Preview Screen -->
  <g filter="url(#shadow)">
    <rect x="25" y="90" width="510" height="335" rx="18" fill="#120309" stroke="rgba(255,100,140,0.2)" stroke-width="1.2" />
    
    <!-- Coordinate Mesh -->
    <line x1="25" y1="257" x2="535" y2="257" stroke="rgba(255,100,140,0.06)" stroke-dasharray="4" />
    <line x1="280" y1="90" x2="280" y2="425" stroke="rgba(255,100,140,0.06)" stroke-dasharray="4" />

    <!-- Star Glow Apex -->
    <circle cx="280" cy="140" r="40" fill="url(#starGlow)" />
    <!-- Star Apex -->
    <polygon points="280,120 286,134 300,136 290,146 292,160 280,152 268,160 270,146 260,136 274,134" fill="#ffd166" />

    <!-- Tree Tier 1 -->
    <polygon points="280,145 220,210 340,210" fill="rgba(6, 214, 160, 0.2)" stroke="#06d6a0" stroke-width="2" />
    <circle cx="240" cy="205" r="5" fill="#ff4d7a" />
    <circle cx="320" cy="205" r="5" fill="#ffd166" />
    <circle cx="280" cy="180" r="4" fill="#00d8ff" />

    <!-- Tree Tier 2 -->
    <polygon points="280,195 180,280 380,280" fill="rgba(6, 214, 160, 0.15)" stroke="#06d6a0" stroke-width="2" />
    <circle cx="205" cy="275" r="6" fill="#ffd166" />
    <circle cx="355" cy="275" r="6" fill="#ff4d7a" />
    <circle cx="270" cy="245" r="5" fill="#e62857" />
    <circle cx="305" cy="235" r="5" fill="#00d8ff" />

    <!-- Tree Tier 3 -->
    <polygon points="280,260 140,360 420,360" fill="rgba(6, 214, 160, 0.12)" stroke="#06d6a0" stroke-width="2" />
    <circle cx="170" cy="350" r="7" fill="#ff4d7a" />
    <circle cx="390" cy="350" r="7" fill="#ffd166" />
    <circle cx="250" cy="320" r="5" fill="#06d6a0" />
    <circle cx="310" cy="310" r="6" fill="#ff4d7a" />

    <!-- Tree Trunk -->
    <rect x="260" y="360" width="40" height="45" rx="6" fill="#4a1525" stroke="#ff6b8b" stroke-width="1.2" />

    <!-- Floating Particles -->
    <circle cx="150" cy="170" r="2.5" fill="#fff" opacity="0.8" />
    <circle cx="190" cy="130" r="3" fill="#ffd166" opacity="0.7" />
    <circle cx="370" cy="150" r="3.5" fill="#ff4d7a" opacity="0.8" />
    <circle cx="430" cy="220" r="2" fill="#00d8ff" opacity="0.9" />
    <circle cx="120" cy="300" r="2.5" fill="#fff" opacity="0.6" />
    <circle cx="440" cy="320" r="3" fill="#ffd166" opacity="0.8" />
  </g>

  <!-- Side Controls Card -->
  <g filter="url(#shadow)">
    <rect x="555" y="90" width="220" height="335" rx="18" fill="url(#cardGrad)" stroke="rgba(255,100,140,0.16)" stroke-width="1.2" />
    <text x="575" y="125" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#fff">CANVAS CONTROLS</text>

    <!-- Particle Density -->
    <rect x="575" y="145" width="180" height="75" rx="12" fill="#16050e" stroke="rgba(255,100,140,0.12)" />
    <text x="590" y="172" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c9a7b0">PARTICLE DENSITY</text>
    <text x="590" y="202" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" fill="#06d6a0">1,400 PTS</text>

    <!-- Shader Glow -->
    <rect x="575" y="235" width="180" height="75" rx="12" fill="#16050e" stroke="rgba(255,100,140,0.12)" />
    <text x="590" y="262" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c9a7b0">GLOW BLUR RADIUS</text>
    <text x="590" y="292" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" fill="#ffd166">18.5 PX</text>

    <!-- TypeScript Core -->
    <rect x="575" y="330" width="180" height="70" rx="14" fill="linear-gradient(135deg, #2b0c1a, #1a060f)" stroke="rgba(255,140,180,0.25)" />
    <text x="665" y="365" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#3178c6" text-anchor="middle">TS + CANVAS API</text>
    <text x="665" y="385" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">PHYSICS-DRIVEN</text>
  </g>
</svg>
