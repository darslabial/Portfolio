<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="fireBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19040c" />
      <stop offset="50%" stop-color="#2a0a19" />
      <stop offset="100%" stop-color="#120308" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#361021" />
      <stop offset="100%" stop-color="#1f0713" />
    </linearGradient>
    <linearGradient id="fireButton" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f03362" />
      <stop offset="100%" stop-color="#800a26" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#fireBg)" />

  <!-- App Header -->
  <rect x="25" y="20" width="750" height="52" rx="14" fill="url(#cardGrad)" filter="url(#shadow)" stroke="rgba(255,100,140,0.18)" stroke-width="1.2" />
  <circle cx="52" cy="46" r="8" fill="#e62857" />
  <text x="75" y="52" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#ffffff">FIREFIGHTER ROBOT TELEOPERATION COCKPIT</text>
  <rect x="585" y="32" width="175" height="28" rx="8" fill="#15050c" stroke="rgba(255,100,140,0.2)" />
  <text x="600" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#06d6a0">● LINK: 2.4GHz RC ACTIVE</text>

  <!-- Left Side: Directional Joystick Pad -->
  <g filter="url(#shadow)">
    <rect x="25" y="88" width="340" height="338" rx="20" fill="url(#cardGrad)" stroke="rgba(255,100,140,0.16)" stroke-width="1.2" />
    <text x="50" y="125" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#fff">NAVIGATION TELEOPERATION</text>
    <text x="50" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9a7b0">Motor Driver PWM Control</text>

    <!-- D-Pad Base -->
    <circle cx="195" cy="265" r="95" fill="#15050e" stroke="rgba(255,100,140,0.12)" stroke-width="2" />
    
    <!-- Forward Button -->
    <rect x="165" y="185" width="60" height="48" rx="12" fill="url(#fireButton)" stroke="rgba(255,180,210,0.3)" filter="url(#shadow)" />
    <polygon points="195,198 180,218 210,218" fill="#ffffff" />

    <!-- Reverse Button -->
    <rect x="165" y="295" width="60" height="48" rx="12" fill="url(#fireButton)" stroke="rgba(255,180,210,0.3)" filter="url(#shadow)" />
    <polygon points="195,330 180,310 210,310" fill="#ffffff" />

    <!-- Left Button -->
    <rect x="110" y="240" width="48" height="60" rx="12" fill="url(#fireButton)" stroke="rgba(255,180,210,0.3)" filter="url(#shadow)" />
    <polygon points="122,270 142,255 142,285" fill="#ffffff" />

    <!-- Right Button -->
    <rect x="230" y="240" width="48" height="60" rx="12" fill="url(#fireButton)" stroke="rgba(255,180,210,0.3)" filter="url(#shadow)" />
    <polygon points="268,270 248,255 248,285" fill="#ffffff" />

    <!-- Center Neutral Indicator -->
    <circle cx="195" cy="270" r="14" fill="#2d0d1b" stroke="rgba(255,100,140,0.2)" />
  </g>

  <!-- Right Side: Water Cannon & Hazard Telemetry -->
  <g filter="url(#shadow)">
    <rect x="385" y="88" width="390" height="195" rx="20" fill="url(#cardGrad)" stroke="rgba(255,100,140,0.16)" stroke-width="1.2" />
    <text x="410" y="122" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#fff">WATER CANNON &amp; EXTINGUISHER ACTUATION</text>
    
    <!-- Pressure gauge -->
    <rect x="410" y="145" width="340" height="42" rx="10" fill="#14050b" stroke="rgba(255,100,140,0.1)" />
    <rect x="413" y="148" width="280" height="36" rx="8" fill="linear-gradient(90deg, #e62857 0%, #06d6a0 100%)" />
    <text x="425" y="172" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#ffffff">PUMP PRESSURE: 92 PSI (ACTIVE STREAM)</text>

    <!-- Spray Nozzle Mode -->
    <rect x="410" y="205" width="160" height="55" rx="12" fill="#190610" stroke="rgba(255,100,140,0.15)" />
    <text x="425" y="228" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c9a7b0">NOZZLE MODE</text>
    <text x="425" y="248" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#00d8ff">FOCUSED JET</text>

    <rect x="590" y="205" width="160" height="55" rx="12" fill="#190610" stroke="rgba(255,100,140,0.15)" />
    <text x="605" y="228" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c9a7b0">WATER RESERVOIR</text>
    <text x="605" y="248" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#06d6a0">78% REMAINING</text>
  </g>

  <!-- Right Bottom: Sensor Telemetry & E-Stop -->
  <g filter="url(#shadow)">
    <rect x="385" y="300" width="390" height="126" rx="20" fill="url(#cardGrad)" stroke="rgba(255,100,140,0.16)" stroke-width="1.2" />
    
    <!-- Flame detected warning -->
    <rect x="410" y="325" width="180" height="78" rx="12" fill="#19050d" stroke="rgba(230,40,87,0.3)" />
    <text x="425" y="352" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c9a7b0">FLAME SENSOR</text>
    <text x="425" y="380" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" fill="#ff4d7a">🔥 TARGET LOCKED</text>

    <!-- Emergency Killswitch -->
    <rect x="610" y="325" width="140" height="78" rx="14" fill="#a00827" stroke="#ff4d7a" stroke-width="2" filter="url(#shadow)" />
    <text x="680" y="360" font-family="'Outfit', sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">EMERGENCY</text>
    <text x="680" y="380" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#ffd166" text-anchor="middle">KILL-SWITCH</text>
  </g>
</svg>
