<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="payBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18040d" />
      <stop offset="50%" stop-color="#280918" />
      <stop offset="100%" stop-color="#110309" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#351020" />
      <stop offset="100%" stop-color="#1e0712" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#payBg)" />

  <!-- Header -->
  <rect x="25" y="20" width="750" height="52" rx="14" fill="url(#cardGrad)" filter="url(#shadow)" stroke="rgba(255,100,140,0.18)" stroke-width="1.2" />
  <circle cx="52" cy="46" r="8" fill="#e62857" />
  <text x="75" y="52" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#ffffff">AUTOMATED PAYROLL &amp; ATTENDANCE LEDGER</text>
  <rect x="580" y="32" width="180" height="28" rx="8" fill="#15050c" stroke="rgba(255,100,140,0.2)" />
  <text x="595" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#06d6a0">CYCLE: SEMI-MONTHLY</text>

  <!-- Ledger Table Card -->
  <g filter="url(#shadow)">
    <rect x="25" y="90" width="510" height="335" rx="18" fill="url(#cardGrad)" stroke="rgba(255,100,140,0.16)" stroke-width="1.2" />
    <text x="50" y="125" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#fff">STAFF SALARY COMPUTATION MATRIX</text>

    <!-- Table Header -->
    <rect x="45" y="145" width="470" height="34" rx="8" fill="#18060f" />
    <text x="60" y="167" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c9a7b0">EMP ID</text>
    <text x="140" y="167" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c9a7b0">NAME</text>
    <text x="260" y="167" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c9a7b0">HOURS</text>
    <text x="350" y="167" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c9a7b0">DEDUCT</text>
    <text x="440" y="167" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#06d6a0">NET PAY</text>

    <!-- Row 1 -->
    <rect x="45" y="188" width="470" height="38" rx="6" fill="#15050c" />
    <text x="60" y="212" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fff">#1001</text>
    <text x="140" y="212" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" fill="#fff">Daryl Labial</text>
    <text x="260" y="212" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fff">88.0 hrs</text>
    <text x="350" y="212" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ff4d7a">-₱1,250</text>
    <text x="440" y="212" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#ffd166">₱34,750</text>

    <!-- Row 2 -->
    <rect x="45" y="235" width="470" height="38" rx="6" fill="#15050c" />
    <text x="60" y="259" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fff">#1002</text>
    <text x="140" y="259" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" fill="#fff">Maria Santos</text>
    <text x="260" y="259" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fff">80.0 hrs</text>
    <text x="350" y="259" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ff4d7a">-₱950</text>
    <text x="440" y="259" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#ffd166">₱28,050</text>

    <!-- Row 3 -->
    <rect x="45" y="282" width="470" height="38" rx="6" fill="#15050c" />
    <text x="60" y="306" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fff">#1003</text>
    <text x="140" y="306" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" fill="#fff">Juan Dela Cruz</text>
    <text x="260" y="306" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fff">85.5 hrs</text>
    <text x="350" y="306" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ff4d7a">-₱1,120</text>
    <text x="440" y="306" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#ffd166">₱31,880</text>

    <!-- Formula Bar -->
    <rect x="45" y="340" width="470" height="60" rx="10" fill="#180610" stroke="rgba(255,100,140,0.12)" />
    <text x="65" y="365" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c9a7b0">AUTOMATED LOGIC:</text>
    <text x="65" y="385" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#06d6a0">Net Pay = (Base Rate × Hours) + Overtime - Tax - SSS/PhilHealth</text>
  </g>

  <!-- Side Metric Cards -->
  <g filter="url(#shadow)">
    <rect x="555" y="90" width="220" height="335" rx="18" fill="url(#cardGrad)" stroke="rgba(255,100,140,0.16)" stroke-width="1.2" />
    <text x="575" y="125" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#fff">PAYROLL SUMMARY</text>

    <rect x="575" y="145" width="180" height="75" rx="12" fill="#16050e" stroke="rgba(255,100,140,0.12)" />
    <text x="590" y="172" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c9a7b0">TOTAL DISBURSEMENT</text>
    <text x="590" y="202" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" fill="#ffd166">₱94,680</text>

    <rect x="575" y="235" width="180" height="75" rx="12" fill="#16050e" stroke="rgba(255,100,140,0.12)" />
    <text x="590" y="262" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c9a7b0">STATUTORY WITHHOLDING</text>
    <text x="590" y="292" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" fill="#ff4d7a">₱3,320</text>

    <rect x="575" y="330" width="180" height="70" rx="14" fill="linear-gradient(135deg, #e62857, #85122e)" stroke="rgba(255,180,210,0.3)" />
    <text x="665" y="372" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">📄 EXPORT PAYSLIPS</text>
  </g>
</svg>
